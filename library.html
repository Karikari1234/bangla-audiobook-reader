<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Books</title>
<style>
:root{
  --bg:#fff; --side:#f5f5f7; --ink:#1d1d1f; --mute:#86868b; --line:#e5e5ea; --accent:#ff9500;
  --paper:#f3e6cc; --paper-ink:#2b2118; --paper-mute:#8a7a66; --hl:rgba(255,196,0,.45); --done:rgba(120,90,40,.35);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#1c1c1e; --side:#2c2c2e; --ink:#f5f5f7; --mute:#98989d; --line:#3a3a3c;
  --paper:#1e1b17; --paper-ink:#e8dccb; --paper-mute:#8f8270; --hl:rgba(255,190,60,.35); --done:rgba(232,220,203,.3);
}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:14px -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;color:var(--ink);background:var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

/* ---------- library ---------- */
#lib{display:flex;height:100%}
aside{width:220px;flex:none;background:var(--side);border-right:1px solid var(--line);padding:18px 10px;overflow:auto}
aside h4{font-size:11px;color:var(--mute);font-weight:600;margin:18px 10px 6px}
.nav{display:flex;align-items:center;gap:8px;width:100%;padding:6px 10px;border-radius:6px;text-align:left}
.nav.on{background:rgba(0,0,0,.08)} @media (prefers-color-scheme:dark){.nav.on{background:rgba(255,255,255,.1)}}
.nav.drop{outline:2px solid var(--accent)}
.nav .n{margin-left:auto;color:var(--mute);font-size:12px}
main{flex:1;overflow:auto;padding:28px 40px 60px}
.top{display:flex;align-items:center;gap:16px;margin-bottom:24px}
.top h1{font-size:28px;font-weight:700;margin:0;letter-spacing:-.02em}
.top input{margin-left:auto;width:240px;padding:7px 12px;border-radius:8px;border:1px solid var(--line);background:var(--side);color:var(--ink);font:inherit}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:36px 28px}
.card{cursor:pointer}
.card .cv{aspect-ratio:2/3;border-radius:3px 6px 6px 3px;overflow:hidden;background:var(--side);display:flex;align-items:flex-end;
  box-shadow:0 1px 2px rgba(0,0,0,.15),0 8px 20px rgba(0,0,0,.12);transition:transform .15s}
.card:hover .cv{transform:translateY(-3px)}
.card img{width:100%;height:100%;object-fit:cover;display:block}
.card .t{font-weight:600;font-size:13px;margin-top:10px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .a{color:var(--mute);font-size:12px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .pr{height:3px;background:var(--line);border-radius:2px;margin-top:6px;overflow:hidden}
.card .pr i{display:block;height:100%;background:var(--accent)}
.empty{color:var(--mute);padding:40px 0}
#dropzone{position:fixed;inset:0;background:rgba(255,149,0,.12);border:3px dashed var(--accent);display:none;
  align-items:center;justify-content:center;font-size:22px;font-weight:600;z-index:50}
body.dragging #dropzone{display:flex}
.menu{position:fixed;background:var(--bg);border:1px solid var(--line);border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.2);padding:4px;z-index:60;min-width:200px}
.menu button{display:block;width:100%;text-align:left;padding:6px 12px;border-radius:5px}
.menu button:hover{background:var(--accent);color:#fff}

/* ---------- reader ---------- */
#rd{display:none;position:fixed;inset:0;background:var(--paper);color:var(--paper-ink)}
#rd .bar{position:absolute;top:0;left:0;right:0;height:44px;display:flex;align-items:center;justify-content:center;
  color:var(--paper-mute);font-weight:600;font-size:13px;z-index:2;background:var(--paper)}
#rd .bar .l{position:absolute;left:14px;display:flex;gap:6px}
#rd .bar button{color:var(--paper-mute);padding:6px 10px;border-radius:6px}
#rd .bar button:hover{background:rgba(0,0,0,.06)}
#toc{position:absolute;top:44px;left:14px;max-height:70vh;overflow:auto;background:var(--paper);border:1px solid rgba(0,0,0,.12);
  border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.2);padding:6px;display:none;z-index:3;width:320px}
#toc button{display:block;width:100%;text-align:left;padding:7px 10px;border-radius:6px;font-family:"Iowan Old Style",Georgia,serif;font-size:15px}
#toc button.on{background:rgba(0,0,0,.08)}
#page{position:absolute;top:44px;bottom:88px;left:0;right:0;overflow:auto;scroll-behavior:smooth}
article{max-width:640px;margin:0 auto;padding:40px 32px 120px;font-family:"Iowan Old Style","Palatino",Georgia,serif;font-size:23px;line-height:1.62}
article h2{text-align:center;font-weight:700;font-size:40px;letter-spacing:-.01em;margin:60px 0 18px;line-height:1.2}
article .orn{text-align:center;color:var(--paper-mute);font-size:22px;margin-bottom:70px;letter-spacing:.4em}
article p{margin:0;text-indent:1.6em;hyphens:auto;-webkit-hyphens:auto;cursor:pointer;border-radius:4px}
article p.first{text-indent:0}
article p.first::first-letter{float:left;font-size:3.3em;line-height:.85;padding:.06em .08em 0 0;color:var(--paper-mute)}
article p:hover{background:rgba(0,0,0,.03)}
article .w{border-radius:3px;transition:background .08s}
article .w.done{text-decoration:underline;text-decoration-color:var(--done);text-underline-offset:5px}
article .w.now{background:var(--hl)}
article .ns{color:#b0451f;font-family:-apple-system,sans-serif;font-size:15px;text-align:center;text-indent:0;margin:20px 0}
.pg{position:absolute;bottom:92px;left:0;right:0;text-align:center;color:var(--paper-mute);font:12px -apple-system,sans-serif}

/* player */
.player{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:6px;
  background:rgba(255,255,255,.72);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
  border:1px solid rgba(0,0,0,.08);border-radius:28px;padding:8px 14px;box-shadow:0 8px 30px rgba(0,0,0,.15);color:#1d1d1f}
@media (prefers-color-scheme:dark){.player{background:rgba(50,48,45,.75);color:#f5f5f7;border-color:rgba(255,255,255,.1)}}
.player button{width:36px;height:36px;border-radius:50%;display:grid;place-items:center}
.player button:hover{background:rgba(127,127,127,.15)}
.player #play{width:44px;height:44px;background:#1d1d1f;color:#fff}
@media (prefers-color-scheme:dark){.player #play{background:#f5f5f7;color:#1d1d1f}}
.player select{font:inherit;font-size:13px;background:transparent;color:inherit;border:0;padding:4px}
.player .st{font-size:12px;opacity:.6;min-width:92px;text-align:center}
svg{width:18px;height:18px;fill:currentColor}
</style>
</head>
<body>
<div id="lib">
  <aside>
    <h4>Library</h4>
    <button class="nav on" data-v="all">All Books <span class="n" id="nAll"></span></button>
    <button class="nav" data-v="reading">Reading Now <span class="n" id="nRead"></span></button>
    <h4>Collections</h4>
    <div id="cols"></div>
    <button class="nav" id="newCol" style="color:var(--mute)">＋ New Collection</button>
  </aside>
  <main>
    <div class="top"><h1 id="vt">All Books</h1><input id="q" placeholder="Search" type="search"></div>
    <div class="grid" id="grid"></div>
  </main>
</div>
<div id="dropzone">Drop a book to add it</div>

<div id="rd">
  <div class="bar">
    <div class="l"><button id="back">‹ Library</button><button id="tocBtn">Contents</button><button id="pronBtn">Pronunciation</button></div>
    <span id="bt"></span>
  </div>
  <div id="toc"></div>
  <dialog id="pronDlg" style="border:0;border-radius:10px;padding:18px;width:min(460px,90vw);background:var(--paper,#fff);color:inherit">
    <form method="dialog">
      <p style="margin:0 0 8px;font-size:14px">One per line: <code>Name = sounds like</code>, or Kokoro phonemes in slashes (<code>Reiko = /ɹˈAkO/</code>).</p>
      <textarea id="pronTxt" rows="10" style="width:100%;box-sizing:border-box;font:13px ui-monospace,monospace" aria-label="Pronunciations"></textarea>
      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:10px"><button value="cancel">Cancel</button><button id="pronSave" value="save" style="background:var(--accent);color:#fff;padding:6px 14px;border-radius:6px">Save</button></div>
    </form>
  </dialog>
  <div id="page"><article id="art"></article></div>
  <div class="pg" id="pg"></div>
  <div class="player">
    <input id="spd" type="range" min="0.5" max="2" step="0.05" value="1" aria-label="Reading speed" style="width:110px;accent-color:var(--accent)">
    <span id="spdV" style="font-size:12px;width:38px;font-variant-numeric:tabular-nums">1.00×</span>
    <button id="prev" title="Previous paragraph"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg></button>
    <button id="play" title="Play (Space)"><svg id="ic" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
    <button id="next" title="Next paragraph"><svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6zM16 6h2v12h-2z"/></svg></button>
    <span class="st" id="st"></span>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const api = (p, o) => fetch(p, o).then(r => r.ok ? r.json() : r.json().then(e => Promise.reject(new Error(e.error))));
let books = [], S = {collections:{}, progress:{}}, view = "all";
const save = () => fetch("/api/state", {method:"POST", body:JSON.stringify(S)});

// ---------- library ----------
async function loadLib(){
  [books, S] = await Promise.all([api("/api/library"), api("/api/state")]);
  renderSide(); renderGrid();
}
function renderSide(){
  $("#nAll").textContent = books.length;
  $("#nRead").textContent = Object.keys(S.progress).filter(id => books.some(b => b.id === id)).length;
  $("#cols").innerHTML = "";
  for (const name of Object.keys(S.collections)) {
    const b = document.createElement("button");
    b.className = "nav" + (view === "c:" + name ? " on" : ""); b.dataset.v = "c:" + name;
    b.innerHTML = `<span></span><span class="n">${S.collections[name].length}</span>`;
    b.firstChild.textContent = name;
    b.oncontextmenu = e => { e.preventDefault(); menu(e, [["Delete Collection", () => { delete S.collections[name]; if (view === "c:"+name) view = "all"; save(); renderSide(); renderGrid(); }]]); };
    b.ondragover = e => { e.preventDefault(); b.classList.add("drop"); };
    b.ondragleave = () => b.classList.remove("drop");
    b.ondrop = e => { b.classList.remove("drop"); const id = e.dataTransfer.getData("book"); if (id) { e.preventDefault(); e.stopPropagation(); addTo(name, id); } };
    $("#cols").append(b);
  }
  document.querySelectorAll(".nav[data-v]").forEach(n => n.classList.toggle("on", n.dataset.v === view));
}
function addTo(name, id){ const c = S.collections[name]; if (!c.includes(id)) { c.push(id); save(); renderSide(); } }
function shown(){
  let list = books;
  if (view === "reading") list = books.filter(b => S.progress[b.id]).sort((a, b) => S.progress[b.id].t - S.progress[a.id].t);
  else if (view.startsWith("c:")) { const ids = S.collections[view.slice(2)] || []; list = books.filter(b => ids.includes(b.id)); }
  const q = $("#q").value.trim().toLowerCase();
  return q ? list.filter(b => (b.title + " " + b.author).toLowerCase().includes(q)) : list;
}
function renderGrid(){
  $("#vt").textContent = view === "all" ? "All Books" : view === "reading" ? "Reading Now" : view.slice(2);
  const g = $("#grid"); g.innerHTML = "";
  const list = shown();
  if (!list.length) g.innerHTML = `<div class="empty">${view.startsWith("c:") ? "Drag books onto this collection in the sidebar." : "No books."}</div>`;
  for (const b of list) {
    const d = document.createElement("div"); d.className = "card"; d.draggable = true;
    const pr = S.progress[b.id];
    d.innerHTML = `<div class="cv"><img loading="lazy" alt=""></div><div class="t"></div><div class="a"></div>${pr ? `<div class="pr"><i style="width:${Math.round(pr.pct*100)}%"></i></div>` : ""}`;
    d.querySelector("img").src = "/api/cover?id=" + b.id;
    d.querySelector("img").onerror = e => e.target.remove();
    d.querySelector(".t").textContent = b.title;
    d.querySelector(".a").textContent = b.author || b.format.toUpperCase();
    d.onclick = () => openBook(b.id);
    d.ondragstart = e => e.dataTransfer.setData("book", b.id);
    d.oncontextmenu = e => {
      e.preventDefault();
      const items = Object.keys(S.collections).map(n => ["Add to " + n, () => addTo(n, b.id)]);
      if (view.startsWith("c:")) items.push(["Remove from Collection", () => { const c = S.collections[view.slice(2)]; c.splice(c.indexOf(b.id), 1); save(); renderSide(); renderGrid(); }]);
      if (pr) items.push(["Mark as Unread", () => { delete S.progress[b.id]; save(); renderSide(); renderGrid(); }]);
      menu(e, items.length ? items : [["New Collection…", () => newCol(b.id)]]);
    };
    g.append(d);
  }
}
function menu(e, items){
  document.querySelector(".menu")?.remove();
  const m = document.createElement("div"); m.className = "menu";
  m.style.left = e.clientX + "px"; m.style.top = e.clientY + "px";
  for (const [label, fn] of items) { const b = document.createElement("button"); b.textContent = label; b.onclick = () => { m.remove(); fn(); }; m.append(b); }
  document.body.append(m);
  setTimeout(() => addEventListener("click", () => m.remove(), {once:true}));
}
function newCol(withId){
  const name = prompt("Collection name")?.trim();
  if (!name || S.collections[name]) return;
  S.collections[name] = withId ? [withId] : [];
  save(); renderSide();
}
$("aside").onclick = e => { const n = e.target.closest(".nav[data-v]"); if (n) { view = n.dataset.v; renderSide(); renderGrid(); } };
$("#newCol").onclick = () => newCol();
$("#q").oninput = renderGrid;

// drop a file from Finder anywhere to add + open it
let dragDepth = 0;
const isFile = e => [...e.dataTransfer.types].includes("Files");
addEventListener("dragenter", e => { if (isFile(e)) { dragDepth++; document.body.classList.add("dragging"); } });
addEventListener("dragleave", e => { if (isFile(e) && --dragDepth <= 0) { dragDepth = 0; document.body.classList.remove("dragging"); } });
addEventListener("dragover", e => { if (isFile(e)) e.preventDefault(); });
addEventListener("drop", async e => {
  if (!isFile(e)) return;
  e.preventDefault(); dragDepth = 0; document.body.classList.remove("dragging");
  let last;
  for (const f of e.dataTransfer.files) {
    try { last = (await api("/api/upload?name=" + encodeURIComponent(f.name), {method:"POST", body:f})).id; }
    catch (err) { alert(f.name + ": " + err.message); }
  }
  await loadLib();
  if (last) openBook(last);
});

// ---------- reader ----------
let B = null, bid = null, C = 0, P = 0, playing = false, cur = null, raf = 0, resumeAt = 0, lastSave = 0;
const audio = new Audio(), fetches = new Map();
const para = (c, p) => {
  const k = `${bid}/${c}/${p}`;
  if (!fetches.has(k)) fetches.set(k, api(`/api/para?id=${bid}&c=${c}&p=${p}`).catch(e => { fetches.delete(k); throw e; }));
  return fetches.get(k);
};

async function openBook(id){
  stop(); bid = id; fetches.clear();
  const meta = books.find(b => b.id === id);
  $("#lib").style.display = "none"; $("#rd").style.display = "block";
  $("#bt").textContent = meta?.title || ""; $("#art").innerHTML = `<p class="ns">Opening…</p>`;
  try { B = await api("/api/book?id=" + id); }
  catch (e) { $("#art").innerHTML = `<p class="ns">Couldn't open this book: ${e.message}</p>`; return; }
  if (B.empty) { $("#art").innerHTML = `<p class="ns">No text found — this looks like a scanned book.</p>`; return; }
  const pr = S.progress[id];
  showChapter(pr ? pr.c : B.start, pr ? pr.p : 0);
  resumeAt = pr?.s || 0; // seconds into the paragraph where you stopped
}
function showChapter(c, p = 0){
  stop(); C = c; P = p;
  const ch = B.chapters[c], a = $("#art");
  a.innerHTML = "";
  if (!B.english && !/[ঀ-৿]/.test(ch.paras.join(""))) a.insertAdjacentHTML("beforeend", `<p class="ns">This book isn't in English; the voice may not read it well.</p>`);
  const h = document.createElement("h2"); h.textContent = ch.title; a.append(h);
  a.insertAdjacentHTML("beforeend", `<div class="orn">· · ·</div>`);
  ch.paras.forEach((t, i) => {
    const el = document.createElement("p"); el.textContent = t; el.dataset.i = i;
    if (i === 0) el.className = "first";
    el.onclick = () => { P = i; play(); };
    a.append(el);
  });
  $("#pg").textContent = `${c + 1} of ${B.chapters.length}`;
  $("#toc").innerHTML = "";
  B.chapters.forEach((x, i) => { const b = document.createElement("button"); b.textContent = x.title; b.className = i === c ? "on" : ""; b.onclick = () => { $("#toc").style.display = "none"; showChapter(i); }; $("#toc").append(b); });
  $("#page").scrollTop = 0;
  pEl(P)?.scrollIntoView({block:"center"});
  para(C, P).catch(() => {}); // warm the first paragraph
}
const pEl = i => $(`#art p[data-i="${i}"]`);

async function play(){
  stop(); playing = true; setIcon();
  const c = C, p = P, el = pEl(p);
  if (!el) return;
  remember();
  $("#st").textContent = "Preparing…";
  let d;
  try { d = await para(c, p); } catch (e) { $("#st").textContent = "Error"; playing = false; setIcon(); return; }
  if (!playing || c !== C || p !== P) return;
  if (p + 1 < B.chapters[c].paras.length) para(c, p + 1).catch(() => {});
  el.innerHTML = "";
  const spans = d.words.map(w => { const s = document.createElement("span"); s.className = "w"; s.textContent = w.w; el.append(s); return s; });
  if (!spans.length) el.textContent = B.chapters[c].paras[p];
  cur = {el, spans, words:d.words};
  el.scrollIntoView({block:"center"});
  audio.src = "data:audio/wav;base64," + d.audio;
  if (resumeAt) { audio.currentTime = Math.max(0, resumeAt - 2); resumeAt = 0; } // back up 2s for context
  audio.playbackRate = +$("#spd").value;
  audio.play();
  $("#st").textContent = `¶ ${p + 1} / ${B.chapters[c].paras.length}`;
  tick();
}
function tick(){
  if (!cur) return;
  const t = audio.currentTime;
  cur.words.forEach((w, i) => { cur.spans[i].classList.toggle("now", t >= w.s && t < w.e); cur.spans[i].classList.toggle("done", t >= w.e); });
  if (playing && Date.now() - lastSave > 5000) { lastSave = Date.now(); keepSpot(); }
  raf = requestAnimationFrame(tick);
}
function stop(){
  if (cur && bid && audio.currentTime > 0) keepSpot();
  playing = false; audio.pause(); cancelAnimationFrame(raf);
  if (cur) { cur.el.textContent = B.chapters[C]?.paras[+cur.el.dataset.i] ?? cur.el.textContent; cur = null; }
  setIcon(); $("#st").textContent = "";
}
audio.onended = () => {
  if (!playing) return;
  if (P + 1 < B.chapters[C].paras.length) { P++; play(); }
  else if (C + 1 < B.chapters.length) { showChapter(C + 1, 0); play(); }
  else stop();
};
function keepSpot(){ const pr = S.progress[bid]; if (pr && pr.c === C && pr.p === P) { pr.s = audio.currentTime; pr.t = Date.now(); save(); } }
addEventListener("pagehide", () => { if (cur && S.progress[bid]) { S.progress[bid].s = audio.currentTime; navigator.sendBeacon("/api/state", JSON.stringify(S)); } });
function remember(){
  const total = B.chapters.reduce((n, c) => n + c.paras.length, 0);
  const before = B.chapters.slice(0, C).reduce((n, c) => n + c.paras.length, 0) + P;
  S.progress[bid] = {c:C, p:P, pct:before / total, t:Date.now()}; save();
}
function setIcon(){ $("#ic").innerHTML = playing ? '<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>' : '<path d="M8 5v14l11-7z"/>'; }
$("#play").onclick = () => playing ? stop() : play();
$("#prev").onclick = () => { if (P > 0) { P--; play(); } else if (C > 0) { showChapter(C - 1, B.chapters[C - 1].paras.length - 1); play(); } };
$("#next").onclick = () => { if (P + 1 < B.chapters[C].paras.length) { P++; play(); } else if (C + 1 < B.chapters.length) { showChapter(C + 1); play(); } };
$("#spd").oninput = () => { audio.playbackRate = +$("#spd").value; $("#spdV").textContent = (+$("#spd").value).toFixed(2) + "×"; };
audio.preservesPitch = true; // keep voice natural when sped up/slowed down
$("#back").onclick = () => { stop(); $("#rd").style.display = "none"; $("#lib").style.display = "flex"; loadLib(); };
$("#tocBtn").onclick = e => { e.stopPropagation(); const t = $("#toc"); t.style.display = t.style.display === "block" ? "none" : "block"; t.querySelector(".on")?.scrollIntoView({block:"center"}); };
$("#pronBtn").onclick = async () => {
  const d = await api("/api/pron?id=" + bid);
  $("#pronTxt").value = Object.entries(d).map(([k, v]) => `${k} = ${v}`).join("\n");
  $("#pronDlg").showModal();
};
$("#pronSave").onclick = async e => {
  e.preventDefault();
  const d = {};
  for (const line of $("#pronTxt").value.split("\n")) { const i = line.indexOf("="); if (i > 0 && line.slice(0, i).trim() && line.slice(i + 1).trim()) d[line.slice(0, i).trim()] = line.slice(i + 1).trim(); }
  try { await api("/api/pron?id=" + bid, {method:"POST", body:JSON.stringify(d)}); } catch (err) { alert(err.message); return; }
  $("#pronDlg").close(); fetches.clear(); if (playing) play(); // re-synthesize with the new pronunciations
};
addEventListener("click", e => { if (!e.target.closest("#toc")) $("#toc").style.display = "none"; });
addEventListener("keydown", e => {
  if ($("#rd").style.display !== "block" || e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
  if (e.code === "Space") { e.preventDefault(); $("#play").click(); }
  if (e.key === "ArrowRight") $("#next").click();
  if (e.key === "ArrowLeft") $("#prev").click();
});

loadLib();
</script>
